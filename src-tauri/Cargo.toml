[package]
name = "bullet-point"
version = "0.1.7"
description = "Bullet Point - produtividade integrada"
authors = ["Darlyson"]
license = ""
repository = "https://github.com/Darlyson/Bullet_Point"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bullet_point_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Só no desktop (Windows/macOS/Linux): atalhos globais e "uma instância só".
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Google Agenda: login (OAuth no navegador), chamadas HTTP e o token guardado
# no Gerenciador de Credenciais do Windows.
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
